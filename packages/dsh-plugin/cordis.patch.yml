# dsh-boss-recruit-kit —— DSH 配置型插件 bundle
#
# 作用：把 boss-recruit-kit 的 MCP 服务器挂进当前 DSH profile 的组合树，
#       之后模型即可直接调用 mcp__boss__* 工具（list / snapshot / capture_resume /
#       download_resume / send_message / request_resume / favorite / audit / cleanup）。
#
# 前置条件（在 DSH 之外，先让底座跑起来）：
#   1) 本地桥：  npm run bridge            （HTTP 127.0.0.1:8898 / WS 127.0.0.1:8899）
#   2) 浏览器：  npm run boss -- browser open
#      —— 必须可见窗口；不要加 --remote-debugging-port（站点会检测 CDP 并关页）
#   3) 自检：    npm run doctor            应显示扩展已连上桥
#
# 安装：DSH 桌面版「设置 → 插件 → 添加插件」填入本目录绝对路径，然后重启应用。
# 说明：MCP 连接失败不会阻止应用启动，但该服务器的工具不会出现（会记一条错误）。

- insert:
    - id: boss-recruit-kit-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: boss
        transport: stdio
        command: node
        # 把这里改成你机器上 MCP 服务器的绝对路径
        args:
          - '<REPO>/packages/mcp-server/src/server.mjs'
        env:
          BOSS_BRIDGE_HTTP: 'http://127.0.0.1:8898'
          BOSS_TOOL_TIMEOUT: '180000'
        # 抓简历 / 下载附件简历都是慢操作，超时给足
        toolCallTimeoutMs: 180000
        failOnStartupError: false
        reconnect:
          enabled: true
          maxAttempts: 10

# 可选：同时挂载 DSH 官方 browser-use（Playwright MCP 后端），用于**非 Boss 站点**的通用浏览。
# 注意 headless 必须为 false；Boss 站点仍建议走本工具链（扩展方案，不暴露 CDP）。
